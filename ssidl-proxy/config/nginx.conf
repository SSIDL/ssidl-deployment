# this sets the user nginx will run as,
#and the number of worker processes
user nobody nogroup;
worker_processes  2;
#user www-data;
#worker_processes auto;

# setup where nginx will log errors to
# and where the nginx process id resides
error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
  # set to on if you have more than 1 worker_processes
  accept_mutex on;
}

http {
  include       /etc/nginx/mime.types;

  default_type application/octet-stream;
  access_log /tmp/nginx.access.log combined;

  # use the kernel sendfile
  # sendfile        on;  # this causes over-caching because modified timestamps lost in VM
  # prepend http headers before sendfile()
  tcp_nopush     on;

  keepalive_timeout  600;
  tcp_nodelay        on;

  gzip  on;
  gzip_vary on;
  gzip_min_length 500;

  gzip_disable "MSIE [1-6]\.(?!.*SV1)";
  gzip_types text/plain text/xml text/css
     text/comma-separated-values
     text/javascript application/x-javascript
     application/atom+xml image/x-icon;

  # configure the virtual host
  server {
    # replace with your domain name
    # server_name inferno-server;

    # port to listen for requests on
    listen 80;

    # maximum accepted body size of client request
    client_max_body_size 4G;
    # the server will close connections after this time
    keepalive_timeout 600;

    # Inferno Test Suite
    location /test/ {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_redirect off;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;

      rewrite ^/test/(.*)$ /$1 break;

      proxy_pass http://inferno:4567/;
    }

    # HL7 Validator API
    location /hl7validatorapi/ {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_redirect off;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;

      proxy_pass http://hl7_validator_service:3500/;
    }

    # Access Verdaccio tarballs via /registry/package/version
    location ~ ^/registry/([^/]+)/([^/]+)$ {
      set $package $1;
      set $version $2;
      rewrite ^ /$package/-/$package-$version.tgz break;
      proxy_pass http://verdaccio:4873;
    }

    # SSIDL Package Registry proxy
    location /registry/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://verdaccio:4873/;
    }

    # SSIDL prototype terminology service
    location /fhir/terminology-service/ {
      proxy_pass http://terminology-service:8092;
    }

    # SSIDL prototype catalog service
    location /fhir/catalog-service/ {
      proxy_pass http://catalog-service:8092;
    }
  }
}
