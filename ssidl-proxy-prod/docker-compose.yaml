name: ssidl-proxy-prod
version: "3.8"

services:
  nginx:
    image: nginx:stable
    container_name: ssidl-nginx-prod
    ports:
      - "80:80"
    volumes:
      - ./config/nginx-prod.conf:/etc/nginx/nginx.conf:ro  
      - ./logs:/var/log/nginx                   
    networks:
      - ssidl-network
    restart: unless-stopped

networks:
  ssidl-network:
    external: true