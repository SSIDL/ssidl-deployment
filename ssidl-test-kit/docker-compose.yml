version: '3'
services:
  hl7_validator_service:
    image: infernocommunity/inferno-resource-validator
    environment:
      SESSION_CACHE_DURATION: -1
    volumes:
      - ./data/igs:/app/igs
    networks:
      - ssidl-network

  # nginx:
  #   image: nginx
  #   volumes:
  #     - ./config/nginx.conf:/etc/nginx/nginx.conf
  #   ports:
  #     - "80:80"
  #   command: [nginx, '-g', 'daemon off;']
  #   depends_on:
  #     - hl7_validator_service

  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    networks:
      - ssidl-network

  inferno:
    image: sbojanowski/ssidl-test-kit
    volumes:
      - ./data:/opt/inferno/data
    depends_on:
      - hl7_validator_service  
    networks:
      - ssidl-network

  worker:
    image: sbojanowski/ssidl-test-kit
    volumes:
      - ./data:/opt/inferno/data
    command: bundle exec sidekiq -r ./worker.rb
    depends_on:
      - redis
    networks:
      - ssidl-network

networks:
  ssidl-network:
    external: true
